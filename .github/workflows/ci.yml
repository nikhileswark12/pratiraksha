name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    env:
      SECRET_KEY: ci-only-secret-key
      DEBUG: 'true'
      MONGO_URI: mongodb://localhost:27017/pratiraksha
      REDIS_URL: redis://localhost:6379/0
      DATABASE_URL: sqlite:///db.sqlite3
      ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Django configuration
        run: python manage.py check --settings=pratiraksha.settings.dev
      - name: Check migration consistency
        run: python manage.py makemigrations --check --dry-run --settings=pratiraksha.settings.dev
      - name: Run backend tests
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Run unit tests
        run: npm run test:unit
      - name: Build frontend
        run: npm run build
