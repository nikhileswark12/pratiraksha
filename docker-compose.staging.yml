version: '3.8'

services:
  db:
    image: postgres:16-alpine
    command: ["postgres", "-c", "max_connections=120"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pratiraksha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: 
      context: .
      dockerfile: Dockerfile
    command: gunicorn pratiraksha.wsgi:application --bind 0.0.0.0:8000
    environment:
      - SECRET_KEY=staging_secret_key_123!
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CORS_ALLOWED_ORIGINS=http://localhost,http://127.0.0.1
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - static_data:/app/staticfiles

  daphne:
    build: 
      context: .
      dockerfile: Dockerfile
    command: daphne -b 0.0.0.0 -p 8002 pratiraksha.asgi:application
    environment:
      - SECRET_KEY=staging_secret_key_123!
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
      - ALLOWED_HOSTS=localhost,127.0.0.1,daphne
    depends_on:
      - db
      - redis

  celery:
    build: 
      context: .
      dockerfile: Dockerfile
    command: celery -A pratiraksha worker -l info --pool=solo
    environment:
      - SECRET_KEY=staging_secret_key_123!
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ml_service:
    build: 
      context: ./ml_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - static_data:/app/staticfiles:ro
    depends_on:
      - web
      - daphne
      - ml_service
      - frontend

volumes:
  postgres_data:
  mongo_data:
  static_data:
