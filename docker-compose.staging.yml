version: '3.8'

services:
  db:
    image: postgres:16-alpine
    # NOTE: max_connections is sized to comfortably accommodate (web + daphne + celery + overhead).
    # INFRASTRUCTURE COST WARNING: Increasing max_connections increases Postgres memory overhead footprint.
    # Whoever provisions the production RDS/Postgres instance must ensure the selected memory tier can support 120 connections.
    command: ["postgres", "-c", "max_connections=120"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pratiraksha
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build: .
    command: gunicorn pratiraksha.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started

  daphne:
    build: .
    command: daphne -b 0.0.0.0 -p 8002 pratiraksha.asgi:application
    volumes:
      - .:/app
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DEBUG=False
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: celery -A pratiraksha worker -l info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://postgres:password@db:5432/pratiraksha
      - MONGO_URI=mongodb://mongo:27017/pratiraksha
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - DB_POOL_SIZE=10
      - DB_MAX_OVERFLOW=5
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  ml_service:
    build: 
      context: ./ml_service
    command: uvicorn main:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"

volumes:
  postgres_data:
  mongo_data:


